<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve" style="white-space:pre"><title>RoadBook data model</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs><rect width="1000" height="520" fill="#ffffff"/><rect x="20" y="20" width="300" height="200" rx="6" fill="#fdf0e7" stroke="#f47230" stroke-width="1.4"/>
<text x="30" y="39" font-weight="600" font-size="13.5" fill="#1f2933">RoadBook</text>
<text x="30" y="58" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">dir, dirty, account</text>
<text x="30" y="74" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">trades [Trade]</text>
<text x="30" y="90" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">setups [Setup]</text>
<text x="30" y="106" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">features [Feature]</text>
<text x="30" y="122" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">instruments [Instrument]</text>
<text x="30" y="138" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">currencies [Currency]</text>
<text x="30" y="154" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">filteredtrades (or None)</text>
<text x="30" y="170" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">listedtrades(), find…, ren…</text>
<rect x="360" y="20" width="300" height="270" rx="6" fill="#fdf0e7" stroke="#f47230" stroke-width="1.4"/>
<text x="370" y="39" font-weight="600" font-size="13.5" fill="#1f2933">Trade (trades.csv)</text>
<text x="370" y="58" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">trade        int (its number)</text>
<text x="370" y="74" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">instrument   name</text>
<text x="370" y="90" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">setup        name</text>
<text x="370" y="106" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">datein       date</text>
<text x="370" y="122" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">dir          Long | Short</text>
<text x="370" y="138" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">lots, tp, stop, out (points)</text>
<text x="370" y="154" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">timein, timeout</text>
<text x="370" y="170" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">euros        (or computed)</text>
<text x="370" y="186" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">graf  [path] primary first</text>
<text x="370" y="202" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">notes</text>
<text x="370" y="218" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">has   {feature name}</text>
<rect x="700" y="20" width="280" height="130" rx="6" fill="#fdf0e7" stroke="#f47230" stroke-width="1.4"/>
<text x="710" y="39" font-weight="600" font-size="13.5" fill="#1f2933">Instrument (activos.csv)</text>
<text x="710" y="58" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">instrument, aka [expr]</text>
<text x="710" y="74" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">currency  name</text>
<text x="710" y="90" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">pipmoney (money a point)</text>
<text x="710" y="106" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">pip, scale, stoppips…</text>
<rect x="700" y="170" width="280" height="100" rx="6" fill="#fdf0e7" stroke="#f47230" stroke-width="1.4"/>
<text x="710" y="189" font-weight="600" font-size="13.5" fill="#1f2933">Currency (divisas.csv)</text>
<text x="710" y="208" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">name, forex (pair)</text>
<text x="710" y="224" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">euros2: the pair's rate</text>
<text x="710" y="240" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">→ toeuros()</text>
<rect x="360" y="320" width="300" height="90" rx="6" fill="#fdf0e7" stroke="#f47230" stroke-width="1.4"/>
<text x="370" y="339" font-weight="600" font-size="13.5" fill="#1f2933">Setup (setups.csv)</text>
<text x="370" y="358" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">setup, descr</text>
<rect x="700" y="300" width="280" height="110" rx="6" fill="#fdf0e7" stroke="#f47230" stroke-width="1.4"/>
<text x="710" y="319" font-weight="600" font-size="13.5" fill="#1f2933">Feature (features.csv)</text>
<text x="710" y="338" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">feature, descr</text>
<text x="710" y="354" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">setups {setup name}</text>
<text x="710" y="370" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  (none: all)</text>
<text x="710" y="386" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">aka [name]</text>
<rect x="20" y="250" width="300" height="160" rx="6" fill="#fdf0e7" stroke="#f47230" stroke-width="1.4"/>
<text x="30" y="269" font-weight="600" font-size="13.5" fill="#1f2933">Account (account.csv)</text>
<text x="30" y="288" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">account (size)</text>
<text x="30" y="304" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">neutral: |result| under it</text>
<text x="30" y="320" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  is Neutral, not OK or KO</text>
<text x="30" y="336" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">fixed, copygraphs</text>
<text x="30" y="352" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">version (Trade1 → Trade)</text>
<path d="M660,60 L698,60" fill="none" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#a)"/>
<text x="649.0" y="54.0" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">by name</text>
<path d="M840,150 L840,168" fill="none" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M510,290 L510,318" fill="none" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#a)"/>
<text x="516.0" y="300.0" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">setup</text>
<path d="M660,270 L680,270 L680,340 L698,340" fill="none" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#a)"/>
<text x="684.0" y="287.0" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">has</text>
<path d="M698,380 L662,380" fill="none" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#a)"/>
<text x="644.0" y="374.0" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">setups</text>
<path d="M320,120 L358,120" fill="none" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="445" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">Trades find their instrument and currency through t.rb; points() is out, ptseuros() the euros (or points × lots × pipmoney × rate),</text>
<text x="20" y="463" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">result(neutral) is OK, KO or Neutral and colours the rows, groups and calendar days. Names are references: renames rewrite</text>
<text x="20" y="481" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">them all (rensetup, renfeature, reninstrument, rencurrency), a new name adds a default row, and a name in use can't be deleted.</text></svg>
