<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xml:space="preserve" style="white-space:pre"><title>RoadBook on disk</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><rect x="20" y="20" width="300" height="230" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.4"/>
<text x="30" y="39" font-weight="600" font-size="13.5" fill="#1f2933">&lt;roadbook&gt;/</text>
<text x="30" y="58" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">account.csv</text>
<text x="30" y="74" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">trades.csv    (; separated)</text>
<text x="30" y="90" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">setups.csv</text>
<text x="30" y="106" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">features.csv</text>
<text x="30" y="122" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">activos.csv   instruments</text>
<text x="30" y="138" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">divisas.csv   currencies</text>
<text x="30" y="154" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">diarygraphs/</text>
<text x="30" y="170" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  trade12dax.png  (primary)</text>
<text x="30" y="186" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  trade12dax.1.png</text>
<text x="30" y="202" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  trade12dax.drw  (drawings)</text>
<rect x="20" y="270" width="300" height="110" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.4"/>
<text x="30" y="289" font-weight="600" font-size="13.5" fill="#1f2933">&lt;roadbook&gt;.dump/</text>
<text x="30" y="308" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">YYMMDD/  one backup a day:</text>
<text x="30" y="324" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  the .csv, images and .drw</text>
<text x="30" y="340" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">.YYMMDD.new while copying</text>
<rect x="360" y="20" width="280" height="120" rx="6" fill="#fdf0e7" stroke="#f47230" stroke-width="1.4"/>
<text x="370" y="39" font-weight="600" font-size="13.5" fill="#1f2933">RoadBook.load()</text>
<text x="370" y="58" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">for each Table in TABLES:</text>
<text x="370" y="74" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  load_objects_from_csv</text>
<text x="370" y="90" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  sorted by its key</text>
<text x="370" y="106" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">Trade1 → Trade when old</text>
<rect x="360" y="160" width="280" height="120" rx="6" fill="#fdf0e7" stroke="#f47230" stroke-width="1.4"/>
<text x="370" y="179" font-weight="600" font-size="13.5" fill="#1f2933">RoadBook.save()</text>
<text x="370" y="198" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">for each Table:</text>
<text x="370" y="214" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  file → file~ (savetable)</text>
<text x="370" y="230" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  write file.tmp, fsync,</text>
<text x="370" y="246" font-size="12" fill="#52606d" font-family="Menlo, Consolas, monospace">  os.replace(tmp, file)</text>
<rect x="680" y="20" width="300" height="140" rx="6" fill="#fdf0e7" stroke="#f47230" stroke-width="1.4"/>
<text x="690" y="39" font-weight="600" font-size="13.5" fill="#1f2933">csv_mapper</text>
<text x="690" y="58" font-size="12.5" fill="#52606d">columns from the type hints:</text>
<text x="690" y="74" font-size="12.5" fill="#52606d">date, time, Enum, bool,</text>
<text x="690" y="90" font-size="12.5" fill="#52606d">numbers, Optional, set and</text>
<text x="690" y="106" font-size="12.5" fill="#52606d">list (; joined, sets sorted)</text>
<text x="690" y="122" font-size="12.5" fill="#52606d">a bad row: an error, not a stop</text>
<rect x="680" y="180" width="300" height="100" rx="6" fill="#fdf0e7" stroke="#f47230" stroke-width="1.4"/>
<text x="690" y="199" font-weight="600" font-size="13.5" fill="#1f2933">Table(attr, file, class, key, renames)</text>
<text x="690" y="218" font-size="12.5" fill="#52606d">trades: datein → date, has → with</text>
<text x="690" y="234" font-size="12.5" fill="#52606d">adding a table: a dataclass and</text>
<text x="690" y="250" font-size="12.5" fill="#52606d">one Table line</text>
<rect x="360" y="300" width="620" height="80" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="370" y="319" font-weight="600" font-size="13.5" fill="#1f2933">graphs</text>
<text x="370" y="338" font-size="12.5" fill="#52606d">RoadBook.storegraphs(t) copies a trade's new graphs into diarygraphs/ under the first free</text>
<text x="370" y="354" font-size="12.5" fill="#52606d">name (mkgraphpath: trade&lt;N&gt;&lt;instr&gt;.png, then .&lt;k&gt;.png), keeping their order and never overwriting</text>
<path d="M320,80 L358,80" fill="none" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M358,220 L320,220" fill="none" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M640,80 L678,80" fill="none" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#a)"/></svg>
